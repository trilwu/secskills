name: validate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Validate plugin structure and skills
        run: python3 scripts/validate.py --strict

      - name: Check JSON manifests parse
        run: |
          python3 -c "import json; json.load(open('.claude-plugin/marketplace.json'))"
          python3 -c "import json; json.load(open('secskills-core/ttp-index.json'))"
          for p in secskills-offense secskills-defense secskills-core; do
            python3 -c "import json; json.load(open('$p/.claude-plugin/plugin.json'))"
          done

      - name: Check ATT&CK sections are in sync with the index
        run: python3 scripts/sync_attack.py --check

      - name: Check evaluation set is well-formed and covers every skill
        run: python3 scripts/run_evals.py --check

      - name: Check the generated docs site is in sync
        run: python3 scripts/build_site.py --check
